services:
  bonita-db:
    container_name: bonita-db
    image: bonitasoft/bonita-postgres:15.4
    ports:
      - "5432:5432"
    volumes:
      - bonita_pgdata:/var/lib/postgresql/data
      - ./bonita/database/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bonita -d bonita"]
      interval: 10s
      timeout: 5s
      retries: 10

  bonita-engine:
    container_name: bonita-engine
    image: bonita:2024.3
    ports:
      - "8080:8080"
    volumes:
    - ./bonita/artifacts:/opt/bonita/artifacts
    - ./bonita/deploy.sh:/opt/bonita/deploy.sh
    - ./bonita/configure-platform.sh:/opt/bonita/configure-platform.sh
    environment:
      DB_VENDOR: postgres
      DB_HOST: bonita-db
      DB_PORT: 5432
      DB_NAME: bonita
      DB_USER: bonita
      DB_PASS: bpm
      BIZ_DB_NAME: business_data
      BIZ_DB_USER: business_data
      BIZ_DB_PASS: bpm
      BONITA_RUNTIME_ADMIN_USERNAME: tech_user
      BONITA_RUNTIME_ADMIN_PASSWORD: secret
      BONITA_PROCESS: Plataforma RescueSync
      PLATFORM_LOGIN: pfadmin
      PLATFORM_PASSWORD: pfsecret
      RESCUESYNC_BACKEND_URL: http://backend:3000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/bonita || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      bonita-db:
        condition: service_healthy
    restart: on-failure

  redis-db:
    container_name: redis-db
    image: redis:7.0
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  nacional-db:
    container_name: api-nacional-db
    image: postgres:15.4
    environment:
      POSTGRES_DB: api_nacional
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - nacional_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d api_nacional"]
      interval: 10s
      timeout: 5s
      retries: 10
  nacional:
    container_name: api-nacional
    build:
      context: ./api-nacional
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
      - "5555:5555" # Puerto expuesto para Prisma Studio
    volumes:
      - ./api-nacional:/app
      - /app/node_modules
    environment:
      PORT: 4000
      REDIS_URL: redis://redis-db:6379/0
      DATABASE_URL: postgresql://postgres:postgres@api-nacional-db:5432/api_nacional?schema=public
      API_PATH: /api/v1
      JWT_SECRET: una-clave-larga-y-dificil-de-adivinar
      JWT_EXPIRES_IN: 3600
      SWAGGER_URL: http://localhost:4000
    depends_on:
      redis-db:
        condition: service_healthy
      nacional-db:
        condition: service_healthy
    restart: unless-stopped

  backend:
    container_name: rescuesync-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://bonita:bpm@bonita-db:5432/rescuesync
      REDIS_URL: redis://redis-db:6379/0
      REDIS_DECODE_RESPONSES: "true"
      #BONITA_ENGINE_URL=http://host.docker.internal:8082/bonita
      BONITA_ENGINE_URL: http://bonita-engine:8080/bonita
      BONITA_ENGINE_API_PATH: /API/bpm
      BONITA_PROCESS: Plataforma RescueSync
      BONITA_USER: walter.bates
      BONITA_PASSWORD: bpm
      NACIONAL_API_URL: http://nacional:4000/api/v1
      JWT_SECRET_KEY: clave_secreta_jwt@McDvk
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    depends_on:
      redis-db:
        condition: service_healthy
      nacional-db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    container_name: rescuesync-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_RESCUE_URL: http://localhost:3000
      VITE_API_RESCUE: /api/rescue
      VITE_API_NACIONAL_URL: http://localhost:4000
      VITE_API_NACIONAL: /api/v1
      CHOKIDAR_USEPOLLING: "true" # Asegura que watchers subyacentes como Chokidar detecten cambios
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  bonita_pgdata:
  redis_data:
  nacional_pgdata:
